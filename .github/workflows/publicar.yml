# Publica a pasta site/ no GitHub Pages sempre que algo nela muda na branch main.
# Antes de publicar, valida o dados.json: se estiver quebrado, o site atual continua no ar.
name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "robo/validar.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validar dados.json
        run: python robo/validar.py site/dados.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
