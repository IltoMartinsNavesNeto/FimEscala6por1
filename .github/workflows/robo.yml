# Robô de atualização: roda todo dia, procura novidades oficiais e, se achar,
# abre um Pull Request com o dados.json atualizado. Nada vai ao ar sem o seu merge.
name: Robô de atualização

on:
  schedule:
    - cron: "17 11 * * *"   # 08:17 em Brasília (o cron do GitHub usa UTC)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
    inputs:
      forcar:
        description: "Consultar o Claude mesmo sem novidade no STF, Planalto ou Diário Oficial (gasta crédito)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: robo-atualizacao
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Já existe proposta aberta?
        id: aberto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --label robo-atualizacao --state open --json number --jq 'length' 2>/dev/null || echo 0)
          echo "abertos=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" != "0" ]; then echo "Há $n proposta(s) aberta(s). Revise antes que o robô proponha outra."; fi

      - name: Propostas recusadas recentemente
        if: steps.aberto.outputs.abertos == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --label robo-atualizacao --state closed --limit 10 \
            --json title,mergedAt,closedAt > robo/recusados.json 2>/dev/null || echo '[]' > robo/recusados.json

      - name: Conferir a chave da API do Claude
        if: steps.aberto.outputs.abertos == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Falta a chave da API::Crie o segredo ANTHROPIC_API_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Rodar o robô
        id: robo
        if: steps.aberto.outputs.abertos == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: python robo/monitor.py ${{ inputs.forcar && '--forcar' || '' }}

      - name: Abrir Pull Request
        if: steps.robo.outputs.abrir_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.robo.outputs.titulo }}
        run: |
          ramo="robo/atualizacao-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$ramo"
          git add site/dados.json robo/estado.json
          git commit -m "Atualização: $TITULO"
          git push origin "$ramo"
          gh label create robo-atualizacao --color C2410C --description "Proposta do robô de atualização" --force
          gh pr create --base main --head "$ramo" --label robo-atualizacao \
            --title "Atualização: $TITULO" --body-file robo/saida/pr.md

      - name: Guardar o estado do robô
        if: steps.robo.outputs.abrir_pr != 'true' && steps.robo.outputs.estado_gravado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo/estado.json
          git commit -m "Robô: atualiza referências das páginas monitoradas" || exit 0
          # A main pode ter recebido commits enquanto o robô rodava: junta antes de enviar.
          for tentativa in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push recusado (tentativa $tentativa); tentando de novo..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning title=Estado do robô não salvo::Não deu para salvar robo/estado.json; ele será atualizado na próxima execução."
